<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Consultation - Caregrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #1f2937; }
        .bg-caregrid-blue { background-color: #2563eb; }
        .text-caregrid-blue { color: #2563eb; }
        .accent-caregrid-blue { accent-color: #2563eb; }
    </style>
</head>
<body class="antialiased">

    <div class="min-h-screen flex flex-col">
        <header class="bg-white shadow-sm">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <a href="index.html" class="flex items-center space-x-2">
                    <svg class="h-8 w-8 text-caregrid-blue" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="text-2xl font-bold text-gray-800">caregrid</span>
                </a>
                <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-caregrid-blue">&larr; Back to Home</a>
            </div>
        </header>

        <main class="flex-grow container mx-auto px-6 py-12 md:py-20">
            <div class="max-w-xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-lg">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-800">Book Your Free Consultation</h1>
                    <p class="text-gray-600 mt-2">Tell us about your clinic to get started.</p>
                </div>
                <form name="consultation" method="POST" action="/thank-you.html" data-netlify="true" netlify-honeypot="bot-field">
                    <input type="hidden" name="form-name" value="consultation">
                    <div class="space-y-6">
                        <div>
                            <label for="clinic-name" class="block text-sm font-medium text-gray-700">Clinic Name</label>
                            <input type="text" id="clinic-name" name="clinic-name" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="doctor-count" class="block text-sm font-medium text-gray-700">Number of Doctors</label>
                            <input type="number" id="doctor-count" name="doctor-count" min="1" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        </div>
                         <div>
                            <label for="clinic-specialty" class="block text-sm font-medium text-gray-700">Clinic Specialty</label>
                            <select id="clinic-specialty" name="clinic-specialty" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                <option>General Practice</option>
                                <option>Dental</option>
                                <option>Dermatology</option>
                                <option>Pediatrics</option>
                                <option>Orthopedics</option>
                                <option>Gynaecology</option>
                                <option>Cardiology</option>
                                <option>ENT</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Preferred Time Slot for an online meeting</label>
                            <div class="mt-2 grid grid-cols-2 gap-2">
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="12:10 - 12:30" class="accent-caregrid-blue"><span class="ml-2 text-sm">12:10 - 12:30</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="12:40 - 1:00" class="accent-caregrid-blue"><span class="ml-2 text-sm">12:40 - 1:00</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="1:10 - 1:30" class="accent-caregrid-blue"><span class="ml-2 text-sm">1:10 - 1:30</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="1:40 - 2:00" class="accent-caregrid-blue"><span class="ml-2 text-sm">1:40 - 2:00</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="2:10 - 2:30" class="accent-caregrid-blue"><span class="ml-2 text-sm">2:10 - 2:30</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="2:40 - 3:00" class="accent-caregrid-blue"><span class="ml-2 text-sm">2:40 - 3:00</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="3:10 - 3:30" class="accent-caregrid-blue"><span class="ml-2 text-sm">3:10 - 3:30</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="3:40 - 4:00" class="accent-caregrid-blue"><span class="ml-2 text-sm">3:40 - 4:00</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="5:10 - 5:30" class="accent-caregrid-blue"><span class="ml-2 text-sm">5:10 - 5:30</span></label>
                                <label class="inline-flex items-center"><input type="radio" name="time-slot" value="5:40 - 6:00" class="accent-caregrid-blue"><span class="ml-2 text-sm">5:40 - 6:00</span></label>
                            </div>
                        </div>
                        <hr/>
                         <p class="text-gray-600 mt-2">Current Clinic Operations:</p>
                        <div>
                             <label class="block text-sm font-medium text-gray-700 mb-2">Appointment Scheduling Method?</label>
                             <div class="space-y-2">
                                 <label class="flex items-center"><input type="radio" name="scheduling-method" value="Paper Diary / Register" class="accent-caregrid-blue"><span class="ml-2">Paper Diary / Register</span></label>
                                 <label class="flex items-center"><input type="radio" name="scheduling-method" value="Google Calendar / Excel" class="accent-caregrid-blue"><span class="ml-2">Google Calendar / Excel</span></label>
                                 <label class="flex items-center"><input type="radio" name="scheduling-method" value="Another Clinic Software" class="accent-caregrid-blue"><span class="ml-2">Another Clinic Software</span></label>
                                 <label class="flex items-center"><input type="radio" name="scheduling-method" value="Receptionist Phone Calls" class="accent-caregrid-blue"><span class="ml-2">Receptionist Phone Calls</span></label>
                             </div>
                        </div>
                         <hr/>
                        <div>
                             <label class="block text-sm font-medium text-gray-700 mb-2">Patient Reminder Method?</label>
                             <div class="space-y-2">
                                 <label class="flex items-center"><input type="radio" name="reminder-method" value="No Reminders Sent" class="accent-caregrid-blue"><span class="ml-2">No Reminders Sent</span></label>
                                 <label class="flex items-center"><input type="radio" name="reminder-method" value="Manual Calls / SMS" class="accent-caregrid-blue"><span class="ml-2">Manual Calls / SMS</span></label>
                                 <label class="flex items-center"><input type="radio" name="reminder-method" value="Bulk SMS Service" class="accent-caregrid-blue"><span class="ml-2">Bulk SMS Service</span></label>
                                 <label class="flex items-center"><input type="radio" name="reminder-method" value="Automated by current software" class="accent-caregrid-blue"><span class="ml-2">Automated by current software</span></label>
                             </div>
                        </div>
                        <hr/>
                        <div>
                             <label class="block text-sm font-medium text-gray-700 mb-2">Billing & Records Method?</label>
                             <div class="space-y-2">
                                 <label class="flex items-center"><input type="radio" name="billing-method" value="Paper Files & Receipts" class="accent-caregrid-blue"><span class="ml-2">Paper Files & Receipts</span></label>
                                 <label class="flex items-center"><input type="radio" name="billing-method" value="Computer Billing, Paper Records" class="accent-caregrid-blue"><span class="ml-2">Computer Billing, Paper Records</span></label>
                                 <label class="flex items-center"><input type="radio" name="billing-method" value="Tally / Excel" class="accent-caregrid-blue"><span class="ml-2">Tally / Excel</span></label>
                                 <label class="flex items-center"><input type="radio" name="billing-method" value="Another Clinic Software" class="accent-caregrid-blue"><span class="ml-2">Another Clinic Software</span></label>
                             </div>
                        </div>
                    </div>
                    <div class="mt-8">
                        <button type="submit" class="w-full bg-caregrid-blue text-white font-bold py-3 px-4 rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-300">Submit & Schedule</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
